[metadata]
name = einsumcc
version = 0.1.0
description = A small, layout-aware tensor contraction compiler
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE

[options]
python_requires = >=3.9
package_dir =
    = src
packages = find:
install_requires =
    numpy>=1.21

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    einsumcc = einsumcc.cli:main
